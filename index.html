<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Puzzle">
<meta name="theme-color" content="#f3ebdd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<title>Puzzle</title>
</head>
<body>

<!-- Collection -->
<main id="gallery" class="screen">
  <header class="gallery-head">
    <p class="eyebrow">The Collection</p>
    <h1>Choose a puzzle</h1>
    <p id="levelNote" class="level-note"></p>
    <button id="settingsBtn" class="icon-btn gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>No puzzles yet. Add images to <code>puzzles/</code> and list them in <code>puzzles/puzzles.json</code>.</p>
</main>

<!-- Settings -->
<main id="settings" class="screen" hidden>
  <div class="bar">
    <button id="settingsBack" class="back">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>
  </div>
  <div class="settings-body">
    <h1>Settings</h1>
    <section>
      <p class="eyebrow">Difficulty</p>
      <div id="levels" class="levels" role="group" aria-label="Difficulty">
        <button data-level="kids">Kids<small>up to 10 pieces</small></button>
        <button data-level="easy">Easy<small>about 40 pieces</small></button>
        <button data-level="medium">Medium<small>about 100 pieces</small></button>
        <button data-level="hard">Hard<small>about 200 pieces</small></button>
      </div>
    </section>
    <section>
      <p class="eyebrow">Music</p>
      <div id="voices" class="levels" role="group" aria-label="Music">
        <button data-voice="piano">Piano</button>
        <button data-voice="harp">Harp</button>
        <button data-voice="off">Off</button>
      </div>
    </section>
  </div>
</main>

<!-- Puzzle -->
<main id="play" class="screen wall" hidden>
  <div class="bar">
    <button id="pauseBtn" class="icon-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <canvas id="guide" class="guide" aria-label="The finished picture"></canvas>
    <button id="peekBtn" class="icon-btn" aria-label="Show or hide the reference picture">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div id="stage" class="stage">
    <div class="frame">
      <div id="board" class="board">
        <div id="pieces"></div>
        <div id="peek" class="peek"></div>
      </div>
    </div>
  </div>

  <div id="reserve" class="reserve empty">
    <span class="reserve-hint">Drag pieces here to set them aside</span>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="menu">
      <p class="eyebrow">Paused</p>
      <button id="resumeBtn" class="link">Resume</button>
      <button id="restartBtn" class="link">Start Over</button>
      <button id="quitBtn" class="link">Collection</button>
      <button id="soundBtn" class="link">Sound: Piano</button>
    </div>
  </div>
</main>

<!-- Solved -->
<main id="done" class="screen wall" hidden>
  <div class="bar">
    <button id="backBtn" class="back">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>
  </div>
  <div class="done-body">
    <article class="plate">
      <div class="plate-face frame">
        <div id="plateImg" class="plate-img"></div>
        <div id="plateText" class="plate-text" hidden></div>
      </div>
      <div class="plate-label">
        <p id="plateSci" class="sci"></p>
        <h2 id="plateName"></h2>
      </div>
    </article>
    <nav class="done-links">
      <button id="descBtn" class="link">Description</button>
      <button id="againBtn" class="link">Solve Again</button>
      <button id="nextBtn" class="link">Next Puzzle</button>
    </nav>
  </div>
</main>

<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
